name: Complete inference certification

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

# Ordinary CI closes every inference routine, node-acceptance, and browser test
# against one immutable producer. Protected retirement remains the strongest
# exact-pair release and attestation gate.
jobs:
  complete-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CI: "1"
      VITEST_MAX_THREADS: "1"
      VITEST_MAX_WORKERS: "1"
    steps:
      - name: Check out inference candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: biochemical-inference
          persist-credentials: false
      - name: Require immutable producer revision pin
        env:
          SIBLING_REF: ${{ vars.BIOCHEMICAL_DB_CERTIFICATION_REF }}
        run: test "${#SIBLING_REF}" -eq 40 && test -z "${SIBLING_REF//[0-9a-f]/}"
      - name: Check out exact producer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.repository_owner }}/biochemical-db
          ref: ${{ vars.BIOCHEMICAL_DB_CERTIFICATION_REF }}
          path: biochemical-db
          persist-credentials: false
      - name: Verify exact producer checkout
        env:
          SIBLING_REF: ${{ vars.BIOCHEMICAL_DB_CERTIFICATION_REF }}
        working-directory: biochemical-db
        run: test "$(git rev-parse HEAD)" = "$SIBLING_REF"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            biochemical-inference/package-lock.json
            biochemical-db/service-js/package-lock.json
      - run: nice -n 10 npm --prefix biochemical-db/service-js ci --no-audit --no-fund
      - run: nice -n 10 npm --prefix biochemical-inference ci --no-audit --no-fund
      - run: nice -n 10 npm --prefix biochemical-inference run test:selection
      - run: nice -n 10 npm --prefix biochemical-inference run check:syntax
      - run: nice -n 10 npm --prefix biochemical-inference run build
      - name: Complete routine selection
        working-directory: biochemical-inference
        run: timeout --signal=TERM --kill-after=30s 22m nice -n 10 npm run test:routine
      - name: Complete node acceptance selection
        working-directory: biochemical-inference
        env:
          GOAL15_ACCEPTANCE_TMPDIR: /dev/shm
          TMPDIR: ${{ runner.temp }}
        run: timeout --signal=TERM --kill-after=30s 22m nice -n 10 npm run test:acceptance:node
      - name: Install Chromium
        working-directory: biochemical-inference
        run: nice -n 10 npx playwright install --with-deps chromium
      - name: Complete production-built browser selection
        working-directory: biochemical-inference
        run: timeout --signal=TERM --kill-after=30s 22m nice -n 10 npm run test:acceptance:e2e:built
